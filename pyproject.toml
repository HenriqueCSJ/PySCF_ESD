[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscf-esd"
version = "0.2.0"
description = "Analytic-first vibronic spectroscopy with PySCF"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pyscf = ["pyscf>=2.15.0"]
anharmonic = ["scipy>=1.10"]
workflow = ["pyscf>=2.15.0", "scipy>=1.10"]

[project.scripts]
pyscf-esd = "pyscf_esd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
