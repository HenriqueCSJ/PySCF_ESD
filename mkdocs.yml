site_name: PySCF ESD
site_url: https://pyscf-esd.readthedocs.io/en/latest/
site_description: Vibronic absorption, fluorescence and phosphorescence with PySCF
repo_url: https://github.com/HenriqueCSJ/PySCF_ESD
repo_name: HenriqueCSJ/PySCF_ESD
edit_uri: edit/main/docs/
theme:
  name: readthedocs
  collapse_navigation: true
  navigation_depth: 3
nav:
  - Home: index.md
  - Getting started:
    - Installation: installation.md
    - First calculation: quickstart.md
    - Workflow and models: guide.md
  - Calculations:
    - Absorption and fluorescence: using-methods.md
    - GPU calculations: gpu.md
    - Phosphorescence and open shell: phosphorescence.md
    - Prepared data and nuclear models: prepared-data.md
  - Results and interpretation:
    - Physical quantities and files: numerical-results.md
    - Broadening and experimental comparison: spectral-comparison.md
    - Troubleshooting and convergence: troubleshooting.md
  - Reference:
    - Command line: command-line.md
    - Python API examples: api.md
    - Python API reference: api-reference.md
    - Theory and conventions: methods.md
  - Benchmarks and development:
    - Spectra gallery: spectra-gallery.md
    - Validation and reproducibility: validation.md
    - CF₃NO reference study: mini-paper.md
    - Methods manuscript (PDF): paper/pyscf-esd.pdf
    - Contributing: contributing.md
validation:
  links:
    anchors: warn
    unrecognized_links: warn
markdown_extensions:
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

use_directory_urls: false
